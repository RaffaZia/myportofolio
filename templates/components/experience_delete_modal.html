<div id="delete-modal-{{ experience.id }}" popover class="project-delete-modal">
    <div class="delete-modal-content">
        <h2>Hapus Experience?</h2>

        <p>
            Apakah kamu yakin ingin menghapus
            <strong>{{ experience.title }}</strong>?
        </p>

        <div class="form-actions">
            <button
                type="button"
                class="button button-secondary"
                popovertarget="delete-modal-{{ experience.id }}"
            >
                Batal
            </button>

            <form
                method="POST"
                action="{% url 'main:delete_experience' experience.id %}"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="button button-danger"
                >
                    Hapus
                </button>
            </form>
        </div>
    </div>
</div>
